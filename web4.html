        .hero {
            background-size: cover;
            background-position: center;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgb(255, 255, 255);
            text-shadow: 2px 2px 5px #000000;
            text-shadow: 2px 2px 6px #000;  
            margin-top: 37px;
        }
        .hero p {
            font-weight: 500;
            font-size:1.5em;

            font-size: 3.5em;
            text-align: center;
        }

           /* Desktop / Default */
            button.learn-more {
              width: 226px;
              height: 50px;
              border-radius: 40%;
              background-color: transparent;
              padding: 0 0 0 0;
              margin: 0 0 0 0;
              border-radius: 1.625rem;
              border-color: #fff8f0;
              
             }
            button.learn-more .circle {
              transition: all 0.45s cubic-bezier(0.65, 0, 0.076, 1);
              position: relative;
              display: block;
              margin: 0;
              width: 3rem;
              height: 3rem;
              background: #373737;
              border-radius: 1.625rem;
            }
             
             button.learn-more .circle .icon {
              transition: all 0.45s cubic-bezier(0.65, 0, 0.076, 1);
              position: absolute;
              top: 0;
              bottom: 0;
              margin: auto;
              background: #fff;
             }
             
            button.learn-more .circle .icon.arrow {
              transition: all 0.45s cubic-bezier(0.65, 0, 0.076, 1);
              left: 0.625rem;
              width: 1.125rem;
              height: 0.125rem;
              background: none;
             }
             
             button.learn-more .circle .icon.arrow::before {
              position: absolute;
              content: "";
              top: -0.29rem;
              right: 0.0625rem;
              width: 0.625rem;
              height: 0.625rem;
              border-top: 0.125rem solid #fff8f0;
              border-right: 0.125rem solid #fff8f0;
              transform: rotate(45deg);
             }
             
             .button-text {
              transition: all 0.45s cubic-bezier(0.65, 0, 0.076, 1);
              position: relative;
              top: -39px;
              left: 2px;
              right: 0px;
              bottom: 0;
              padding: 0.75rem 0;
              margin: 0 0 0 1.85rem;
              color: #000000;
              font-weight: 700;
              font-size: 19px;
              line-height: 1.6;
              text-align: center;
              text-transform: uppercase;
              text-decoration: none;
              font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
             }
             
             button:hover .circle {
              width: 100%;
             }
             
             button:hover .circle .icon.arrow {
              background: #fff;
              transform: translate(1rem, 0);
             }
             
             button:hover .button-text {
              color: #ffffff;
             }
            
            /* Mobile Responsiveness */
            @media (max-width: 768px) {
            .hero {
              margin-top: 0px;
            }
            .hero h1 {
              font-size: 2em;
            }         
            .hero p {
              font-size: 1em;
            }
                
            button.learn-more {
              width: 161px;
              height: 42px;
            }
            
            button.learn-more .circle {
              width: 2.48rem;
              height: 2.48rem;
            }
            
            .button-text {
              font-size: 14px;
              top: -30px;
              left: 0px;
            }

             button:hover .circle {
              width: 100%;
             }
             
             button:hover .circle .icon.arrow {
              background: #fff;
              transform: translate(0.5rem, 0);
             }
             
             button:hover .button-text {
              color: #ffffff;
             }

             button.learn-more .circle .icon.arrow {
              left: 0.3rem;
             }
         }
            
</style>

        <style>
/* Navbar Base */
.golden-navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #2c2c2c;
  padding: 10px 20px;
  position: fixed;
  width: 100%;
  top: 0;
}

.left-section {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  height: 40px;
}

.logo-text {
  font-size: 20px;
  font-weight: bold;
  color: gold;
}

/* Right Menu (desktop default) */
.right-section {
  display: flex;
  gap: 20px;
  list-style: none;
  transition: all 0.3s ease-in-out;
  color: golden;
}

.right-section:hover {
    color: white;
}

.right-section li a {
  text-decoration: none;
  color: gold;
  font-size: 23px;
  transition: color 0.3s;
  background: none;
  border: none;
}

.right-section li a:hover {
  color: white;
  cursor: pointer;
}

/* Hide checkbox */
#menu-toggle {
  display: none;
}

/* Hamburger */
.hamburger {
  display: none;
  cursor: pointer;
  color: #ffd700;
  text-shadow: 2px 2px 6px #000;
}
    
.hamburger input {
  display: none;
}

.hamburger svg {
  /* The size of the SVG defines the overall size */
  height: 3em;
  /* Define the transition for transforming the SVG */
  transition: transform 600ms cubic-bezier(0.4, 0, 0.2, 1);
}

.line {
  fill: none;
  stroke: white;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 3;
  /* Define the transition for transforming the Stroke */
  transition: stroke-dasharray 600ms cubic-bezier(0.4, 0, 0.2, 1),
              stroke-dashoffset 600ms cubic-bezier(0.4, 0, 0.2, 1);
}

.line-top-bottom {
  stroke-dasharray: 12 63;
}

.hamburger input:checked + svg {
  transform: rotate(-45deg);
}

.hamburger input:checked + svg .line-top-bottom {
  stroke-dasharray: 20 300;
  stroke-dashoffset: -32.42;
}

/* =======================
   Tablet/Mobile (<=768px)
======================= */
@media (max-width: 1056px) {
  .right-section {
    flex-direction: column;
    background: #444;
    position: absolute;
    top: 72px;
    right: -250px;
    width: 200px;
    padding: 20px;
    border-radius: 5px;
    transition: right 0.4s ease;
    right: -100%; /* hide off-screen */
    width: 33%; /* ya jitna chaho */
  }

  .hamburger {
    display: flex;
    cursor: pointer;
  }

  #menu-toggle:checked ~ .right-section {
    right: 0; 
}

.right-section li a {
  font-size: 19px;
}

.right-section li a {
    font-size: 18px;
}
    
}
    
</style>
