<style>
      * {
          -webkit-tap-highlight-color: transparent;
        }
    
        body {
          margin: 0;
          font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman';
          background-color: #fff4d0;
          background: linear-gradient(to bottom, #fff8e1, #ffe6cc);
          color: #333;
          padding: 0;
          height: 100%;
          -webkit-tap-highlight-color: transparent;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;

.styled-wrapper .button {
  display: block;
  position: relative;
  width: 61px;
  height: 61px;
  margin: 0;
  overflow: hidden;
  outline: none;
  background-color: transparent;
  cursor: pointer;
  border: 0;
}

.styled-wrapper .button:before {
  content: "";
  position: absolute;
  border-radius: 50%;
  inset: 7px;
  border: 3px solid #ffd700; /* Update dynamically for light/dark mode */
  transition:
  opacity 0.4s cubic-bezier(0.77, 0, 0.175, 1) 80ms,
  transform 0.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) 80ms;
  box-shadow: 0 0 12px gold;
  object-fit: cover;
  text-shadow: 2px 2px 6px #000;
}

.styled-wrapper .button:after {
  content: "";
  position: absolute;
  border-radius: 50%;
  inset: 7px;
  border: 4px solid #ffd700;
  transform: scale(1.3);
  transition:
  opacity 0.4s cubic-bezier(0.165, 0.84, 0.44, 1),
  transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  opacity: 0;
  box-shadow: 0 0 12px gold;
  object-fit: cover;
  text-shadow: 2px 2px 6px #000;
}

.styled-wrapper .button:hover:before,
.styled-wrapper .button:focus:before {
  opacity: 0;
  transform: scale(0.7);
  transition:
  opacity 0.4s cubic-bezier(0.165, 0.84, 0.44, 1),
  transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.styled-wrapper .button:hover:after,
.styled-wrapper .button:focus:after {
  opacity: 1;
  transform: scale(1);
  transition:
  opacity 0.4s cubic-bezier(0.77, 0, 0.175, 1) 80ms,
  transform 0.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) 80ms;
}

.styled-wrapper .button-box {
  display: flex;
  position: absolute;
  top: 0;
  left: 0;
}

.styled-wrapper .button-elem {
  display: block;
  width: 28px;
  height: 28px;
  margin: 16px 9px 0 16px;
  transform: rotate(360deg);
  fill: #f0eeef;
  font-weight: 700;
}

.styled-wrapper .button:hover .button-box,
.styled-wrapper .button:focus .button-box {
  transition: 0.4s;
  transform: translateX(-53px);
}
.back {
  position: absolute;
  left: 7px;
  top: 9px;
}

    /* Responsive */
    @media (max-width: 768px) {
       .styled-wrapper .button {
        width: 56px;
        height: 56px;
      }
      .styled-wrapper .button-elem {
        width: 23px;
        height: 23px;
        margin: 16px 14px 0 16px;
        margin-top: 16px;
      }
      .back {
        top: 8px;

     .chatbox-header {
        background: radial-gradient(circle, #8B0000, #4b0000);
        border-top: 4px solid gold;
        border-bottom: 4px solid gold;
        padding: 14px 50%;
        display: flex;
        top: 0;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        z-index: 9999;
    }

    .chatbox-header .icon {
        object-fit: cover;
        width: 48px;
        height: 48px;
        margin-right: 7px;
        margin-left: -64px;
        border: 3px solid gold;
        box-shadow: 0 0 12px gold;
        text-shadow: 2px 2px 6px #000;
        border-radius: 50%;
    } 

    .garuda {
          font-size: 1.8rem;
          font-weight: bold;
          color: gold;
          margin-top: -5px;
          text-shadow: 2px 2px 6px #000;
    }
      
      /* Body */
      .chatbox-body {
        flex: 1;
        padding: 108px;
        background: rgba(255, 255, 255, 0.8);
        background: #fff4d0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 623px;
        animation: fadeIn 0.5s ease-in-out;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      } 
      
      /* Footer */
      .chatbox-footer {
        display: flex;
        padding: 10px;
        border-top: 1px solid #ddd;
      }
      
      .chatbox-footer input {
        flex: 1;
        padding: 12px;
        border-radius: 25px;
        border: 1px solid #ccc;
        outline: none;
        font-size: 19px;
        outline: none;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      }
      
      .chatbox-footer button {
        background: #d7005d;
        color: white;
        border: none;
        border-radius: 50%;
        width: 52px;
        height: 52px;
        margin-left: 10px;
        cursor: pointer;
        font-size: 19px;
        outline: none;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      } 
      
      /* Message Bubbles */
     .user-message, .bot-message {
        padding: 10px 15px;
        border-radius: 20px;
        max-width: 80%;
        line-height: 1.5;
        font-size: 19px;
        animation: messageIn 0.3s ease-in-out;
      }
      
      .user-message {
        background: #d5fcd4;
        align-self: flex-end;
        border-bottom-right-radius: 5px;
      }
      .bot-message {
        background: #d7f0ff;
        align-self: flex-start;
        border-bottom-left-radius: 5px;
      }
      
      @keyframes messageIn {
        from { transform: translateX(20px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }

    <script>
        
      function handleEnter(event) {
        if (event.key === 'Enter') {
          sendMessage();
        }
      }
      
      function sendMessage() {
        const input = document.getElementById('userInput');
        const msg = input.value.trim();
        if (!msg) return;
      
        addMessage('user', msg);
        input.value = '';
      
        setTimeout(() => {
          const reply = getReply(msg.toLowerCase());
          addMessage('bot', reply);
        }, 600);
      }
      
      function addMessage(sender, text) {
        const chatBody = document.getElementById('chatBody');
        const div = document.createElement('div');
        div.className = sender === 'user' ? 'user-message' : 'bot-message';
        div.innerText = text;
        chatBody.appendChild(div);
        chatBody.scrollTop = chatBody.scrollHeight;
      }

}
