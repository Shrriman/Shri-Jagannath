<style>
      * {
          -webkit-tap-highlight-color: transparent;
        }
    
        body {
          margin: 0;
          font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman';
          background-color: #fff4d0;
          background: linear-gradient(to bottom, #fff8e1, #ffe6cc);
          color: #333;
          padding: 0;
          height: 100%;
          -webkit-tap-highlight-color: transparent;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch; 
        }

.styled-wrapper .button {
  display: block;
  position: relative;
  width: 61px;
  height: 61px;
  margin: 0;
  overflow: hidden;
  outline: none;
  background-color: transparent;
  cursor: pointer;
  border: 0;
}

.styled-wrapper .button:before {
  content: "";
  position: absolute;
  border-radius: 50%;
  inset: 7px;
  border: 3px solid #ffd700; /* Update dynamically for light/dark mode */
  transition:
  opacity 0.4s cubic-bezier(0.77, 0, 0.175, 1) 80ms,
  transform 0.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) 80ms;
  box-shadow: 0 0 12px gold;
  object-fit: cover;
  text-shadow: 2px 2px 6px #000;
}

.styled-wrapper .button:after {
  content: "";
  position: absolute;
  border-radius: 50%;
  inset: 7px;
  border: 4px solid #ffd700;
  transform: scale(1.3);
  transition:
  opacity 0.4s cubic-bezier(0.165, 0.84, 0.44, 1),
  transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  opacity: 0;
  box-shadow: 0 0 12px gold;
  object-fit: cover;
  text-shadow: 2px 2px 6px #000;
}

.styled-wrapper .button:hover:before,
.styled-wrapper .button:focus:before {
  opacity: 0;
  transform: scale(0.7);
  transition:
  opacity 0.4s cubic-bezier(0.165, 0.84, 0.44, 1),
  transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.styled-wrapper .button:hover:after,
.styled-wrapper .button:focus:after {
  opacity: 1;
  transform: scale(1);
  transition:
  opacity 0.4s cubic-bezier(0.77, 0, 0.175, 1) 80ms,
  transform 0.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) 80ms;
}

.styled-wrapper .button-box {
  display: flex;
  position: absolute;
  top: 0;
  left: 0;
}

.styled-wrapper .button-elem {
  display: block;
  width: 28px;
  height: 28px;
  margin: 16px 9px 0 16px;
  transform: rotate(360deg);
  fill: #f0eeef;
  font-weight: 700;
}

.styled-wrapper .button:hover .button-box,
.styled-wrapper .button:focus .button-box {
  transition: 0.4s;
  transform: translateX(-53px);
}
.back {
  position: absolute;
  left: 7px;
  top: 9px;
}

    /* Responsive */
    @media (max-width: 768px) {
       .styled-wrapper .button {
        width: 56px;
        height: 56px;
      }
      .styled-wrapper .button-elem {
        width: 23px;
        height: 23px;
        margin: 16px 14px 0 16px;
        margin-top: 16px;
      }
      .back {
        top: 8px;
      }
   }

     .chatbox-header {
        background: radial-gradient(circle, #8B0000, #4b0000);
        border-top: 4px solid gold;
        border-bottom: 4px solid gold;
        padding: 14px 50%;
        display: flex;
        top: 0;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        z-index: 9999;
    }

    .chatbox-header .icon {
        object-fit: cover;
        width: 48px;
        height: 48px;
        margin-right: 7px;
        margin-left: -64px;
        border: 3px solid gold;
        box-shadow: 0 0 12px gold;
        text-shadow: 2px 2px 6px #000;
        border-radius: 50%;
    } 

    .garuda {
          font-size: 1.8rem;
          font-weight: bold;
          color: gold;
          margin-top: -5px;
          text-shadow: 2px 2px 6px #000;
    }
      
      /* Body */
      .chatbox-body {
        flex: 1;
        padding: 108px;
        background: rgba(255, 255, 255, 0.8);
        background: #fff4d0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 623px;
        animation: fadeIn 0.5s ease-in-out;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      } 
      
      /* Footer */
      .chatbox-footer {
        display: flex;
        padding: 10px;
        border-top: 1px solid #ddd;
      }
      
      .chatbox-footer input {
        flex: 1;
        padding: 12px;
        border-radius: 25px;
        border: 1px solid #ccc;
        outline: none;
        font-size: 19px;
        outline: none;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      }
      
      .chatbox-footer button {
        background: #d7005d;
        color: white;
        border: none;
        border-radius: 50%;
        width: 52px;
        height: 52px;
        margin-left: 10px;
        cursor: pointer;
        font-size: 19px;
        outline: none;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      } 
      
      /* Message Bubbles */
     .user-message, .bot-message {
        padding: 10px 15px;
        border-radius: 20px;
        max-width: 80%;
        line-height: 1.5;
        font-size: 19px;
        animation: messageIn 0.3s ease-in-out;
      }
      
      .user-message {
        background: #d5fcd4;
        align-self: flex-end;
        border-bottom-right-radius: 5px;
      }
      .bot-message {
        background: #d7f0ff;
        align-self: flex-start;
        border-bottom-left-radius: 5px;
      }
      
      @keyframes messageIn {
        from { transform: translateX(20px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      } 

@media(max-width: 768px) {

    .chatbox-header {
        padding: 13px 50%;
    }

    .garuda {
        font-size: 1.4rem;
    }
        
    .chatbox-body {

    .chatbox-footer input {

    }

    .chatbox-header .icon {
        width: 40px;
        height: 40px;
    }

    .user-message, .bot-message {
        font-size: 16px;
    }      
}

    <script>
        
        
      function handleEnter(event) {
        if (event.key === 'Enter') {
          sendMessage();
        }
      }
      
      function sendMessage() {
        const input = document.getElementById('userInput');
        const msg = input.value.trim();
        if (!msg) return;
      
        addMessage('user', msg);
        input.value = '';
      
        setTimeout(() => {
          const reply = getReply(msg.toLowerCase());
          addMessage('bot', reply);
        }, 600);
      }
      
      function addMessage(sender, text) {
        const chatBody = document.getElementById('chatBody');
        const div = document.createElement('div');
        div.className = sender === 'user' ? 'user-message' : 'bot-message';
        div.innerText = text;
        chatBody.appendChild(div);
        chatBody.scrollTop = chatBody.scrollHeight;
      }
      
      function getReply(msg) {
          msg = msg.toLowerCase();
        if (msg.includes('where') || msg.includes('kahan par') || msg.includes('कहां पर') || msg.includes('kidhar') || msg.includes('किधर') || msg.includes('kauthi') || msg.includes('keunthi') || msg.includes('keunthare') || msg.includes('keunthaare') || msg.includes('kauthaare') || msg.includes('କେଉଁଠି') || msg.includes('କେଉଁଠାରେ') || msg.includes('କଉଠି') || msg.includes('କଉଠାରେ') || msg.includes('kauthare')) return "ଏହି ମନ୍ଦିରଟି ଭାରତର ଓଡ଼ିଶା ରାଜ୍ୟର ପୁରୀ ସହରରେ ଅବସ୍ଥିତ।";
          if (msg.includes('temple') || msg.includes('mandir') || msg.includes('मंदिर') || msg.includes('टेम्पल') || msg.includes('ମନ୍ଦିର') || msg.includes('ଟେମ୍ପଲ୍')) {
          return "ମହାପ୍ରଭୁ ଜଗନ୍ନାଥଙ୍କ ମୁଖ୍ୟ ମନ୍ଦିର ପୁରୀ ସହରରେ ଅବସ୍ଥିତ। ସମୁଦ୍ର କୂଳରେ ଆଧାରିତ ଏହି ପବିତ୍ର ମନ୍ଦିର ଓଡ଼ିଶାର ସାର୍ବଜନୀନ ପ୍ରାର୍ଥନାସ୍ଥଳ ଭାବରେ ପରିଚିତ। ଏହା ହିନ୍ଦୁ ଧର୍ମର ଚାରୋଟି ପବିତ୍ର ଧାମ ମଧ୍ୟରୁ ଗୋଟିଏ ଏବଂ ବିଶ୍ୱର ଶ୍ରେଷ୍ଠ ଓ ସର୍ବପ୍ରମୁଖ ମନ୍ଦିର ମଧ୍ୟରେ ଗଣା ଯାଇଥାଏ। ଏହି ମନ୍ଦିରକୁ ଜଗନ୍ନାଥଙ୍କର ଭୂଲୋକ ନିବାସ ଭାବରେ ବିବେଚିତ କରାଯାଏ, ଯେଉଁଠି ସେ ତାଙ୍କର ଭାଇ ବଳଭଦ୍ର ଓ ଭଉଣୀ ସୁଭଦ୍ରାଙ୍କ ସହିତ ବାସ କରନ୍ତି।";
        }
          if(msg.includes('live') || msg.includes('worship') || msg.includes('puja paanti') || msg.includes('puja panti') || msg.includes('ruhanti') || msg.includes('rahuchanti') || msg.includes('rahuchhanti') || msg.includes('basa karanti') || msg.includes('पूजा पाते') || msg.includes('puja paate') || msg.includes('puje jaate') || msg.includes('पूजे जाते') || msg.includes('रेहेते है') || msg.includes('रेहते है') || msg.includes('ରୁହନ୍ତି') || msg.includes('ରହୁଛନ୍ତି') || msg.includes('ବାସ କରନ୍ତି') || msg.includes('rehte') || msg.includes('rehete') || msg.includes('rehate') || msg.includes('bas karte') || msg.includes('ରହନ୍ତି')) { 
              return "ମୁଖ୍ୟତଃ ଭାରତର ଓଡ଼ିଶା ରାଜ୍ୟର ପୁରୀ ସହରର ଜଗନ୍ନାଥ ମନ୍ଦିରରେ ମହାପ୍ରଭୁ ଜଗନ୍ନାଥଙ୍କ ଉପାସନା କରାଯାଏ, ଯେଉଁଠି ସେ ତାଙ୍କର ବଡ଼ ଭାଇ ବଳଭଦ୍ର ଓ ସାନ ଭଉଣୀ ମା ସୁଭଦ୍ରାଙ୍କ ସହ ବାସ କରନ୍ତି।";
          }
         if(msg.includes('with') || msg.includes('kie kie') || msg.includes('kaun kaun') || msg.includes('kiske saath') || msg.includes('kon kon') || msg.includes('saha') || msg.includes('sahita') || msg.includes('sathire') || msg.includes('sangare') || msg.includes('ସହ') || msg.includes('ସହିତ') || msg.includes('ସାଥିରେ') || msg.includes('ସାଙ୍ଗରେ') || msg.includes('କିଏ କିଏ') || msg.includes('कौन कौन') || msg.includes('किसके साथ')) return "ମହାପ୍ରଭୁ ଜଗନ୍ନାଥ ପୁରୀର ଜଗନ୍ନାଥ ମନ୍ଦିରରେ ନିମ୍ନଲିଖିତ ଦେବତାମାନଙ୍କ ସହ ବାସ କରନ୍ତି:\n\n" +
             "1. ପ୍ରଭୁ ବଳଭଦ୍ର - ତାଙ୍କର ବଡ଼ ଭାଇ, ଯାହାକୁ ବଳରାମ ବୋଲି ମଧ୍ୟ କୁହାଯାଏ; ଯିଏ ଶକ୍ତିଶାଳୀ ଓ ରକ୍ଷାକାରୀ ଭାବେ ପୂଜିତ।\n" +
             "2. ଦେବୀ ସୁଭଦ୍ରା - ତାଙ୍କର ସାନ ଭଉଣୀ, ଯିଏ ଦିବ୍ୟ, ପବିତ୍ରତା ଓ ଭକ୍ତିର ପ୍ରତୀକ।\n" +
             "3. ଚକ୍ରରାଜ ସୁଦର୍ଶନ- ଏହାକୁ ଦିବ୍ୟ ଅସ୍ତ୍ର ଓ ରକ୍ଷାକାରୀ ଭାବେ ବିବେଚନା କରାଯାଏ, ଯାହା ଜଗନ୍ନାଥଙ୍କ ପାଖରେ ବିରାଜମାନ।\n\n" +

        if (msg.includes('rath yatra') || msg.includes('रथयात्रा') || msg.includes('ରଥଯାତ୍ରା') || msg.includes('car festival')) return "ରଥଯାତ୍ରା ହେଉଛି ମହାପ୍ରଭୁ ଜଗନ୍ନାଥଙ୍କର ବିଶାଳ ଯାତ୍ରା। ଏହି ଅବସରରେ ମହାପ୍ରଭୁ ଜଗନ୍ନାଥ, ପ୍ରଭୁ ବଳଭଦ୍ର ଓ ଦେବୀ ସୁଭଦ୍ରା କାଠ ନିର୍ମିତ ରଥରେ ବିଜେ କରନ୍ତି। ଏହି ରଥଗୁଡ଼ିକୁ ହଜାର ହଜାର ଭକ୍ତ ଟାଣିଥାନ୍ତି। ଏହି ଯାତ୍ରା ଜଗନ୍ନାଥ ମନ୍ଦିରରୁ ଗୁଣ୍ଡିଚା ମନ୍ଦିର ପର୍ଯ୍ୟନ୍ତ ହୁଏ। ଏହି ପବିତ୍ର ଉତ୍ସବ ପ୍ରତିବର୍ଷ ଜୁନ କିମ୍ବା ଜୁଲାଇ (ଆଷାଢ଼ ମାସ) ମାସରେ ପାଳିତ ହୁଏ। ଏହା ବିଶ୍ୱର ସବୁଠାରୁ ବଡ଼ ଧାର୍ମିକ ଯାତ୍ରାଗୁଡ଼ିକ ମଧ୍ୟରୁ ଗୋଟିଏ।";
