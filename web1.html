    <style>

  /* Fullscreen overlay with blur */
  #desktopOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(20, 20, 20, 0.85);
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  #desktopOverlay.show {
    opacity: 1;
    pointer-events: all;
  }

  /* Modal box */
  #desktopModal {
    background: #222831;
    padding: 30px 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 150, 255, 0.6);
    max-width: 360px;
    color: #ffffff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    transform: scale(0.8);
    animation: modalPop 0.5s forwards;
  }

  /* Animation for modal pop */
  @keyframes modalPop {
    to {
      transform: scale(1);
    }
  }

  #desktopModal h2 {
    margin-bottom: 20px;
    font-size: 1.9rem;
    font-weight: 700;
    padding: 7px 23px;
    background-color: #ffbf00;
    border-radius: 13px;
  }

  #desktopModal p {
    font-size: 1.15rem;
    margin-bottom: 25px;
    line-height: 1.5;
  }

  /* Stylish button */
  #desktopModal button {
    position: relative;
    background: #00adb5;
    color: #ffffff;
    border: none;
    padding: 12px 28px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0, 161, 169, 0.7);
    transition: background 0.3s ease;
  }
  #desktopModal button:hover {
    background: #00b8c1;
  }

        @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman';
  -webkit-tap-highlight-color: transparent;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-size: cover;
  margin: 0; 
}

@property --a {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}

.box {
  position: relative;
  width: 307px;
  height: 307px;
  background: repeating-conic-gradient(
    from var(--a),
    #CBD702 0%,
    #ff27cdc1 5%,
    transparent 5%,
    transparent 40%,
    #47ACC9 50%
  );
  filter: drop-shadow(0 15px 50px #47ACC9);
  animation: rotating 4s linear infinite;
  border-radius: 20px;
  display: flex;
  transition: 0.5s;
  top: 19px;
}

.box:hover {
  width: 361px;
  height:361px;
}

@keyframes rotating {
  0% {
    --a: 0deg;
  }
  100% {
    --a: 360deg;
  }
}

.box::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: repeating-conic-gradient(
    from var(--a),
    #ff27cdc1 0%,
    #45f3ff 5%,
    transparent 5%,
    transparent 40%,
    #fff345 50%
  );
  filter: drop-shadow(0 15px 50px #fff345);
  border-radius: 20px;
  animation: rotating 4s linear infinite;
  animation-delay: -1s;
}

.box::after {
  content: "";
  position: absolute;
  inset: 4px;
  background: linear-gradient(90deg, #ffa700, #FFD700, #87CEFA, #00ccff);
  border-radius: 15px;
  border: 0.5px solid #999;
}

.boxinside {
  position: absolute;
  inset: 50px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 15px;
  flex-direction: column;
  background: #ffaa33;
  z-index: 1000;
  box-shadow: inset 0 10px 20px rgba(0, 0, 0, 0.5);
  border-bottom: 2px solid rgba(255, 255, 255, 0.5);
  transition: 0.5s;
  color: #fff;
  overflow: hidden;
}

img {
        object-fit: cover;
        height: 100%;
        width: 100%;
}
  
.button {
  position: absolute;
    bottom: 126px;
    width: 186px;
    height: 48px;
    background: linear-gradient(90deg, #ffa700, #FFD700, #87CEFA, #00ccff);
    border: none;
    border-radius: 5px;
    color: #000000;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: -1px;
    transition: 0.5s;
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.5);
    cursor: pointer;
    left: 45.4%;
    top: 75%;
}

.button:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 14px rgba(0, 0, 0, 0.5);
    width: 190px;
    height: 50px;
}

.select {
    position: absolute;
    bottom: 61px;
    width: 256px;
    height: 48px;
    background: linear-gradient(90deg, #ffa700, #FFD700, #87CEFA, #00ccff);
    border: none;
    border-radius: 5px;
    color: #000000;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -1px;
    transition: 0.5s;
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.5);
    cursor: pointer;
    display: block;
    left: 43.4%;
    cursor: pointer;
    top: 82%;
}

span::after {
  float: center;
  right: 10px;
  content: "﹀";
}

.slide {
  clear:both;
  text-decoration: none;
  width: 100%;
  border-radius: 5px;
  float: right;
  height: 0px;
  overflow: hidden;
  transition: height .4s ease;
  background: linear-gradient(90deg, #ffa700, #FFD700, #87CEFA, #00ccff);
  font-weight: bold;
  font-size: 19px;
}

.slide li {padding : 1px;}

#touch {position: absolute; opacity: 0; height:0;}    

#touch:checked + .slide {height: 250%;}

a {
  background-image: linear-gradient(to right, rgb(0, 255, 170), rgb(0, 255, 255), rgb(0, 38, 255) 50%, #000 50%);
  background-size: 200% 100%;
  background-position: -100%;
  display: inline-block;
  padding: 5px 0;
  position: relative;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  transition: all 0.3s ease-in-out;
}

a:before{
  content: '';
  background:  rgb(0, 255, 255);
  display: block;
  position: absolute;
  bottom: -3px;
  left: 0;
  width: 0;
  height: 3px;
  transition: all 0.3s ease-in-out;
}

a:hover {
 background-position: 0;
}

a:hover::before{
  width: 100%;
}

.flower {
  position: absolute;
  top: -50px;
  font-size: 24px;
  animation: fall 5s linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}

.welcome-banner {
  position: absolute;
  background: black;
  border-radius: 10px 10px 0 0;
  z-index: 3000;
  overflow: hidden;
  background: transparent;
  width: 95.5%; /* same as box */
  height: 100%;
  top: 10px;
  bottom: 10px;
  left: 5px;
}

.welcome-banner:hover {
  width: 96.5%;
}

.scroll-text {
  display: inline-block;
  white-space: nowrap;
  color: rgb(96, 96, 96);
  font-weight: bold;
  font-size: 25px;
  justify-content: center;
  padding-left: 100%;
  animation: scrollWelcome 13s linear infinite;
  background: radial-gradient(circle, rgb(0, 0, 0), rgb(0, 0, 0), rgb(0, 0, 0), rgb(0, 0, 0), rgb(0, 0, 0));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}


@keyframes scrollWelcome {
  0% {
    transform: translateX(0%);
  }
  100% {
    transform: translateX(-100%);
  }
}

/* Default desktop styles */
.wel, .come {
  position: absolute;
  font-size: 56px;
  font-weight: bold;
  background: radial-gradient(circle, rgb(255, 225, 0), rgb(0, 255, 162), rgb(0, 255, 255), rgb(0, 38, 255));   
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-align: center;
  top: 52%;
  transform: translate(-50%, -50%);
}

.wel { left: 600px; }
.come { right: 250px; }

@media (max-width: 768px) {

  body {
    flex-direction: column;
    background-size: cover;
    background-position: center;
    background-image: url('jagannath.jpeg');
  }

  .box {
    width: 61vw;
    height: 61vw;
    top: -13px;
    margin: 10px auto; /* top se thoda space aur horizontally center */
  }

  .box:hover {
    width: 61vw;
    height: 61vw;
  }

  .boxinside {         /* thoda kam padding */
    border-radius: 7px;
    font-size: 14px;       /* text size thoda kam */
    overflow: hidden;
    inset: 37px;
  }
  
  .button {
    width: 142px;      /* width chhota kiya */
    height: 38px;      /* height kam kiya */
    font-size: 9px;   /* font size chhota kiya */
    bottom: 100px;      /* position thoda adjust kiya */
    left: 50%;         /* center align */
    transform: translateX(-50%);
  }

  .button:hover {
    width: 142px;
    height: 38px;
    left: 50%;
    transform: scale(1.05) translateX(-50%);
  }

  .select {
    width: 200px;      /* chhota kiya */
    height: 38px;      /* height kam kiya */
    font-size: 12px;   /* font size kam kiya */
    bottom: 40px;      /* position adjust kiya */
    left: 50%;         /* center align */
    transform: translateX(-50%);
  }

  .scroll-text {
    font-size: 18px;
    padding-left: 50%;
  }

.welcome-container {
    position: relative;
    display: flex;
    flex-direction: row; /* or 'column' if you want stacked */
    justify-content: center;
    align-items: center;
    gap: 5px; /* spacing between wel and come */
    height: auto;
    transform: none;
    top: 0;
    margin: 0 0;
  }

  .wel, .come {
    top: -28px;
    position: relative; /* remove absolute */
    font-size: 28px;
    transform: none;
    left: auto;
    right: auto;
  }

  .flower {
    font-size: 11px;
  }

  .slide {
    font-size: 17px;
  }
}

.flower {
  font-size: 16px;
}

@media (orientation: landscape) and (max-width: 900px) {

  .wel, .come {
    display: none;
  }

  .img {
    display: none;
  }
}


</style>

<script>
 // Function to detect mobile or tablet devices
function isMobileOrTablet() {
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}

// Close modal function
function closeModal() {
  const overlay = document.getElementById('desktopOverlay');
  overlay.classList.remove('show');
  document.body.style.overflow = 'auto';
}

// Show overlay only on mobile/tablet
window.onload = function() {
  if (isMobileOrTablet()) {
    const overlay = document.getElementById('desktopOverlay');
    overlay.classList.add('show');
    document.body.style.overflow = 'hidden'; // Prevent background scroll
  }
}

</script>
