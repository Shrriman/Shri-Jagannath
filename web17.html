body {

  height: 100%;
  -webkit-tap-highlight-color: transparent;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch; 
}

.styled-wrapper .button {
  display: block;
  position: relative;
  width: 61px;
  height: 61px;
  margin: 0;
  overflow: hidden;
  outline: none;
  background-color: transparent;
  cursor: pointer;
  border: 0;
}

.styled-wrapper .button:before {
  content: "";
  position: absolute;
  border-radius: 50%;
  inset: 7px;
  border: 3px solid #ffd700; /* Update dynamically for light/dark mode */
  transition:
  opacity 0.4s cubic-bezier(0.77, 0, 0.175, 1) 80ms,
  transform 0.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) 80ms;
  box-shadow: 0 0 12px gold;
  object-fit: cover;
  text-shadow: 2px 2px 6px #000;
}

.styled-wrapper .button:after {
  content: "";
  position: absolute;
  border-radius: 50%;
  inset: 7px;
  border: 4px solid #ffd700;
  transform: scale(1.3);
  transition:
  opacity 0.4s cubic-bezier(0.165, 0.84, 0.44, 1),
  transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  opacity: 0;
  box-shadow: 0 0 12px gold;
  object-fit: cover;
  text-shadow: 2px 2px 6px #000;
}

.styled-wrapper .button:hover:before,
.styled-wrapper .button:focus:before {
  opacity: 0;
  transform: scale(0.7);
  transition:
  opacity 0.4s cubic-bezier(0.165, 0.84, 0.44, 1),
  transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.styled-wrapper .button:hover:after,
.styled-wrapper .button:focus:after {
  opacity: 1;
  transform: scale(1);
  transition:
  opacity 0.4s cubic-bezier(0.77, 0, 0.175, 1) 80ms,
  transform 0.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) 80ms;
}

.styled-wrapper .button-box {
  display: flex;
  position: absolute;
  top: 0;
  left: 0;
}

.styled-wrapper .button-elem {
  display: block;
  width: 28px;
  height: 28px;
  margin: 16px 9px 0 16px;
  transform: rotate(360deg);
  fill: #f0eeef;
  font-weight: 700;
}

.styled-wrapper .button:hover .button-box,
.styled-wrapper .button:focus .button-box {
  transition: 0.4s;
  transform: translateX(-53px);
}
.back {

<script>
// Toggle between Photos and Videos
const photosBtn = document.getElementById('showPhotos');
const videosBtn = document.getElementById('showVideos');
const photos = document.getElementById('photos');
const videos = document.getElementById('videos');
const photoHeading = photos.previousElementSibling;
const videoHeading = videos.previousElementSibling;

function showPhotosGallery() {
    photos.style.display = 'grid';
    videos.style.display = 'none';
    photoHeading.style.display = 'block';
    videoHeading.style.display = 'none';
    photosBtn.classList.add('active');
    videosBtn.classList.remove('active');
}

function showVideosGallery() {
    videos.style.display = 'grid';
    photos.style.display = 'none';
    videoHeading.style.display = 'block';
    photoHeading.style.display = 'none';
    videosBtn.classList.add('active');
    photosBtn.classList.remove('active');
}

// Default show photos
showPhotosGallery();

photosBtn.addEventListener('click', showPhotosGallery);
videosBtn.addEventListener('click', showVideosGallery);
</script>
