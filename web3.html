        <!-- CSS -->
        <style>

       * {
           -webkit-tap-highlight-color: transparent;
       }

       body {
            margin: 0;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman';
            background-color: #fff4d0;
            color: #333;
            padding: 0;
            height: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
            
/* Navbar Base */
.golden-navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #2c2c2c;
  padding: 10px 20px;
  position: fixed;
  width: 100%;
  top: 0;
}

.left-section {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  height: 40px;
}

.logo-text {
  font-size: 20px;
  font-weight: bold;
  color: gold;
}

/* Right Menu (desktop default) */
.right-section {
  display: flex;
  gap: 20px;
  list-style: none;
  transition: all 0.3s ease-in-out;
  color: golden;
}

.right-section:hover {
    color: white;
}

.right-section li a,
.lang-btn {
  text-decoration: none;
  color: gold;
  font-size: 23px;
  transition: color 0.3s;
  background: none;
  border: none;
}

.right-section li a:hover,
.lang-btn:hover {
  color: white;
  cursor: pointer;
}

/* Hide checkbox */
#menu-toggle {
  display: none;
}

/* Hamburger */
.hamburger {
  display: none;
  cursor: pointer;
  color: #ffd700;
  text-shadow: 2px 2px 6px #000;
}
    
.hamburger input {
  display: none;
}

.hamburger svg {
  /* The size of the SVG defines the overall size */
  height: 3em;
  /* Define the transition for transforming the SVG */
  transition: transform 600ms cubic-bezier(0.4, 0, 0.2, 1);
}

.line {
  fill: none;
  stroke: white;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 3;
  /* Define the transition for transforming the Stroke */
  transition: stroke-dasharray 600ms cubic-bezier(0.4, 0, 0.2, 1),
              stroke-dashoffset 600ms cubic-bezier(0.4, 0, 0.2, 1);
}

.line-top-bottom {
  stroke-dasharray: 12 63;
}

.hamburger input:checked + svg {
  transform: rotate(-45deg);
}

.hamburger input:checked + svg .line-top-bottom {
  stroke-dasharray: 20 300;
  stroke-dashoffset: -32.42;
}


@media (max-width: 768px) {
  .right-section {
    flex-direction: column;
    background: #444;
    position: absolute;
    top: 72px;
    right: -250px;
    width: 200px;
    padding: 20px;
    border-radius: 5px;
    transition: right 0.4s ease;
    right: -100%; /* hide off-screen */
    width: 33%; /* ya jitna chaho */
  }

  .hamburger {
    display: flex;
    cursor: pointer;
  }

  #menu-toggle:checked ~ .right-section {
    right: 0; 
}
.logo-text {
  font-size: 16px;
}
}
    
</style>
