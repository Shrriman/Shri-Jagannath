             }

              transition: all 0.45s cubic-bezier(0.65, 0, 0.076, 1);
              position: relative;
              display: block;
              margin: 0;
              width: 3rem;
              height: 3rem;
              background: #373737;
              border-radius: 1.625rem;
            }
             
             button.learn-more .circle .icon {
              transition: all 0.45s cubic-bezier(0.65, 0, 0.076, 1);
              position: absolute;
              top: 0;
              bottom: 0;
              margin: auto;
              background: #fff;
             }
             
            button.learn-more .circle .icon.arrow {
              transition: all 0.45s cubic-bezier(0.65, 0, 0.076, 1);
              left: 0.625rem;
              width: 1.125rem;
              height: 0.125rem;
              background: none;
             }
             
             button.learn-more .circle .icon.arrow::before {
              position: absolute;
              content: "";
              top: -0.29rem;
              right: 0.0625rem;
              width: 0.625rem;
              height: 0.625rem;
              border-top: 0.125rem solid #fff8f0;
              border-right: 0.125rem solid #fff8f0;
              transform: rotate(45deg);
             }
             
             .button-text {
              transition: all 0.45s cubic-bezier(0.65, 0, 0.076, 1);
              position: relative;
              top: -39px;
              left: 2px;
              right: 0px;
              bottom: 0;
              padding: 0.75rem 0;

              font-weight: 700;
              font-size: 19px;

              text-transform: uppercase;
              text-decoration: none;
              font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
             }
             
             button:hover .circle {
              width: 100%;
             }
             
             button:hover .circle .icon.arrow {
              background: #fff;
              transform: translate(1rem, 0);
             }
             
             button:hover .button-text {
              color: #ffffff;
             }

             }

              left: 0.3rem;
             }

      <style>
      
      /* Floating Chat Icon */
      #chatIcon {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: Linear-gradient(137deg, #ffd700, #970000);
        color: rgb(255, 255, 255);
        font-size: 37px;
        padding: 16px;
        border-radius: 50%;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        cursor: pointer;
        z-index: 1000;
        animation: pulse 2s infinite;
      }
      #chatIcon:hover {
        transform: scale(1.1);
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(109, 58, 185, 0.5); }
        70% { box-shadow: 0 0 0 15px rgba(138,58,185,0); }
        100% { box-shadow: 0 0 0 0 rgba(138,58,185,0); }
      }
      
      /* Chatbox Container */
      #chatboxContainer {
        position: fixed;
        bottom: 113px;
        right: 30px;
        width: 383px;
        max-height: 550px;
        background: linear-gradient(to bottom right, #fffefc, #f0f8ff);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        display: none;
        flex-direction: column;
        overflow: hidden;
        z-index: 999;
        animation: slideIn 0.4s ease;
        background-image: url('https://www.puriotdc.com/wp-content/uploads/2017/05/jagannath-temple.jpg');
        background-size: cover;
      }
      
      @keyframes slideIn {
        from { transform: translateY(50px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      
      /* Header with Chakra */
      .chatbox-header {
        background:  Linear-gradient(to left, #ffd700, #970000);
        color: #ffffff;
        padding: 15px;
        font-size: 18px;
        font-weight: bold;
        text-align: center;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .chatbox-header .icon {
        width: 30px;
        height: 30px;
      }
      
      /* Body */
      .chatbox-body {
        flex: 1;
        padding: 15px;
        background: rgba(255, 255, 255, 0.8);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 400px;
        animation: fadeIn 0.5s ease-in-out;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      /* Footer */
      .chatbox-footer {
        display: flex;
        padding: 10px;
        border-top: 1px solid #ddd;
      }
      
      .chatbox-footer input {
        flex: 1;
        padding: 12px;
        border-radius: 25px;
        border: 1px solid #ccc;
        outline: none;
        font-size: 15px;
      }

        color: white;
        border: none;
        border-radius: 50%;
        width: 42px;
        height: 42px;
        margin-left: 10px;
        cursor: pointer;
        font-size: 16px;
      }
      
      /* Message Bubbles */
      .user-message, .bot-message {
        padding: 10px 15px;
        border-radius: 20px;
        max-width: 80%;
        line-height: 1.6;
        font-size: 15px;

      .user-message {

      .bot-message {
        background: #d7f0ff;
        align-self: flex-start;
      }
      
      @keyframes messageIn {
        from { transform: translateX(20px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }

      @media (max-width: 768px) {

    <script>
      const audio = new Audio('audio.mpeg'); // Define once, globally
  audio.loop = true;
        
        function toggleChatbox() {
        const box = document.getElementById('chatboxContainer');
            
    if (box.style.display === 'flex') {
      box.style.display = 'none';
      audio.pause();
      audio.currentTime = 0;
    } else {
      box.style.display = 'flex';
      audio.play();
    }
}
      
      function handleEnter(event) {
        if (event.key === 'Enter') {
          sendMessage();
        }
      }
      
      function sendMessage() {
        const input = document.getElementById('userInput');
        const msg = input.value.trim();
        if (!msg) return;
      
        addMessage('user', msg);
        input.value = '';
      
        setTimeout(() => {
          const reply = getReply(msg.toLowerCase());
          addMessage('bot', reply);
        }, 600);
      }
      
      function addMessage(sender, text) {
        const chatBody = document.getElementById('chatBody');
        const div = document.createElement('div');
        div.className = sender === 'user' ? 'user-message' : 'bot-message';
        div.innerText = text;
        chatBody.appendChild(div);
        chatBody.scrollTop = chatBody.scrollHeight;
      }

        function getReply(msg) {
          msg = msg.toLowerCase();
        if (msg.includes('where') || msg.includes('kahan par') || msg.includes('कहां पर') || msg.includes('kidhar') || msg.includes('किधर') || msg.includes('kauthi') || msg.includes('keunthi') || msg.includes('keunthare') || msg.includes('keunthaare') || msg.includes('kauthaare') || msg.includes('କେଉଁଠି') || msg.includes('କେଉଁଠାରେ') || msg.includes('କଉଠି') || msg.includes('କଉଠାରେ') || msg.includes('kauthare')) return "यह मंदिर भारत के ओडिशा राज्य के पुरी शहर में स्थित है।";
          if (msg.includes('temple') || msg.includes('mandir') || msg.includes('मंदिर') || msg.includes('टेम्पल') || msg.includes('ମନ୍ଦିର') || msg.includes('ଟେମ୍ପଲ୍')) {
          return "महाप्रभु श्री जगन्नाथ जी के मुख्य मंदिर पुरी शहर में स्थित है। समुद्र तट पर बसे इस पवित्र मंदिर को ओडिशा का सार्वजानिक प्रार्थना स्थल माना जाता है। यह हिंदू धर्म के चार प्रमुख पवित्र धामों में से एक है और विश्व के श्रेष्ठतम और प्रमुख मंदिरों में गिना जाता है। इस मंदिर को भगवान जगन्नाथ जी के पृथ्वी लोक निवास माना जाता है, जहाँ वो अपने भाई बलभद्र और बहन सुभद्रा के साथ वास करते हैं।";
        }
          if(msg.includes('live') || msg.includes('worship') || msg.includes('puja paanti') || msg.includes('puja panti') || msg.includes('ruhanti') || msg.includes('rahuchanti') || msg.includes('rahuchhanti') || msg.includes('basa karanti') || msg.includes('पूजा पाते') || msg.includes('puja paate') || msg.includes('puje jaate') || msg.includes('पूजे जाते') || msg.includes('रेहेते है') || msg.includes('रेहते है') || msg.includes('ରୁହନ୍ତି') || msg.includes('ରହୁଛନ୍ତି') || msg.includes('ବାସ କରନ୍ତି') || msg.includes('rehte') || msg.includes('rehete') || msg.includes('rehate') || msg.includes('bas karte') || msg.includes('ରହନ୍ତି')) { 
              return "मुख्यतः भारत के ओडिशा राज्य के पुरी शहर में स्थित श्री जगन्नाथ मंदिर में महाप्रभु जगन्नाथ जी की उपासना की जाती है, जहाँ वो अपने बड़े भाई प्रभु बलभद्र और छोटी बहन मां सुभद्रा के साथ निवास करते हैं।";
          }
         if(msg.includes('with') || msg.includes('kie kie') || msg.includes('kaun kaun') || msg.includes('kiske saath') || msg.includes('kon kon') || msg.includes('saha') || msg.includes('sahita') || msg.includes('sathire') || msg.includes('sangare') || msg.includes('ସହ') || msg.includes('ସହିତ') || msg.includes('ସାଥିରେ') || msg.includes('ସାଙ୍ଗରେ') || msg.includes('କିଏ କିଏ') || msg.includes('कौन कौन') || msg.includes('किसके साथ')) return "महाप्रभु श्री जगन्नाथ पुरी के जगन्नाथ मंदिर में निम्नलिखित देवताओं के साथ निवास करते हैं:\n\n" +
             "१. प्रभु बलभद्र – उनके बड़े भाई, जिन्हें बलराम भी कहा जाता है; जिन्हें शक्तिशाली और रक्षक के रूप में पूजा जाता है।\n" +
             "२. देवी सुभद्रा – उनकी छोटी बहन, जो दिव्यता, पवित्रता और भक्ति का प्रतीक हैं।\n" +

             "इन चारों देवताओं को मंदिर के गर्भगृह में स्थित रत्न सिंहासन पर एक साथ पूजा की जाती है।";
